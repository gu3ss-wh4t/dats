#& BINDS
unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-p previous-window
bind -n M-n next-window


#& SETTINGS
set -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:Tc'
# set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g mouse on
set -g allow-rename off

#$ Status Bar
set -g status on
set -g status-style bg=default
set -g status-style 'fg=#515c7e'
set -g status-justify centre
set -g status-position top

set -g status-left '#[fg=#ff0586]#S #[fg=#7aa2f7]#{window_name}'
set -g status-left-length 20

set -g status-right '%b #[fg=#ff0586]%_d #[fg=#515c7e]%a #[fg=#ff0586]%_I.%M#[fg=#515c7e]%P'

setw -g window-status-current-format '#[fg=#ff0586]#I:#[fg=#fc8a20]#W#[fg=#ff0586]#F '
setw -g window-status-format '#[fg=#515c7e]#I:#W#[fg=#fc8a20]#F '

#$ Messages
set -g message-style 'fg=#dddbf9'


#& PLUGINS
set -g @plugin 'tmux-plugins/tpm'

#$ Sensible
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g default-terminal 'screen-256color'
setw -g aggressive-resize on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'