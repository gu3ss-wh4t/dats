# Window
# hide_window_decorations yes
# remember_window_size  no
# initial_window_width  960
# initial_window_height 1080
# remember_window_position  no
modify_font underline_position 7
modify_font underline_thickness 50%

selection_foreground none
selection_background none

# Fonts
font_family      family='CaskaydiaCove Nerd Font' style=ExtraLight features='+calt +ordn +zero'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 15

# Theme
include current-theme.conf

# Scrollback
scrollback_lines 5000
scrollback_pager_history_size 50

# Mouse
mouse_hide_wait -2

# Tabs
tab_bar_style slant

# Notifications
notify_on_cmd_finish invisible 15

# Cursor
shell_integration enabled no-cursor
cursor_trail 85
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 1
cursor_trail_color #ff7800
cursor_shape underline
cursor_underline_thickness 0.5
cursor_shape_unfocused hollow
cursor_blink_interval 0.5
cursor_stop_blinking_after 25